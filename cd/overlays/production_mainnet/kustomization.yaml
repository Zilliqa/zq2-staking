apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zq2-stake-prd-mainnet

resources:
  - ../../base
  - backendpolicy.yaml
  - httproute.yaml
  - pdb.yaml

patches:
  - path: deployment-spread-patch.yaml
    target:
      kind: Deployment
      name: zq2-stake-frontend
  - target:
      kind: ConfigMap
      name: zq2-stake-frontend
    path: configmap.yaml
  - target:
      kind: Secret
      name: zq2-stake-frontend
    path: secrets.yaml

# Two replicas (Autopilot drains nodes for upgrades and bin-packing; one pod would mean a short outage), kept
# apart by the PDB and spread across zones when possible.
replicas:
  - name: zq2-stake-frontend
    count: 2
